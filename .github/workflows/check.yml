name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Test runtime, fallback, installer and package
        run: python3 -m unittest discover -s tests -v
      - name: Validate shell and Terminal AppleScript
        run: |
          sh -n workflow/run.sh
          osacompile -o "$RUNNER_TEMP/terminal.scpt" workflow/terminal.applescript
      - name: Build workflow
        run: python3 scripts/build.py
